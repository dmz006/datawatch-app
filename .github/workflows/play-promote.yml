name: Play — promote to closed testing

# Promote a build from the internal track to closed testing (`alpha`) without
# re-uploading. The release workflow does this for every tag; run this by hand
# to catch the closed track up or promote a specific version code.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code to promote (empty = newest on the source track)'
        type: string
        default: ''
      from_track:
        description: 'Source track (wear: wear:internal)'
        type: string
        default: 'internal'
      to_track:
        description: 'Target track (wear: the Wear closed track id)'
        type: string
        default: 'alpha'

# Play allows one open edit per app; every workflow that opens one queues here.
concurrency:
  group: play-edits
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_PUBLISHER_KEY_JSON }}
          CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth requests
          python3 scripts/play_promote.py --package com.dmzs.datawatchclient \
            --from-track "${{ inputs.from_track }}" --to-track "${{ inputs.to_track }}" ${CODE:+--version-code "$CODE"}
