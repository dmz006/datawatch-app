# PR-time dependency gate — parity with dmz006/datawatch's
# .github/workflows/dependency-review.yaml. Complements security.yml's weekly
# OWASP dependency-check by failing a PR at diff time.
#
# Fails the PR on:
#   - any HIGH (or critical) severity vulnerability in a newly-added/upgraded dep
#   - license incompatibility (deny-list below)
#
# Gradle note: GitHub's Dependency Graph does not parse Gradle builds on its
# own, so dependency-review would silently see zero Gradle dependencies. The
# `submit-graph` job resolves the build with gradle/actions/dependency-submission
# and uploads a snapshot — on push to main (the base the PR is compared
# against) and on every PR head. The review job runs after it and retries on
# "snapshot not yet available" warnings.

name: dependency-review

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'gradle/libs.versions.toml'
      - '**/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-graph:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write   # dependency-submission uploads a snapshot to the Dependency Graph API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2

  review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    needs: [submit-graph]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # so the action can comment the summary on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          # Copyleft licenses incompatible with how the app is distributed.
          deny-licenses: 'GPL-3.0-only, AGPL-3.0-only'
          comment-summary-in-pr: always
          # The Gradle snapshot from submit-graph can lag a few seconds.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
