name: Android Screenshots

# Google Play / README screenshots of the Android app, the twin of
# ios-screenshots.yml. Starts a throwaway datawatch demo server on the runner,
# seeds non-sensitive demo content (scripts/screenshots/seed-demo.sh), builds the
# publicTrack debug APK (DEBUG launch hooks: dwSeedURL/dwTab/dwOpenSession…, see
# ui/debug/DebugLaunchHooks.kt) and captures phone, 7" and 10" tablet sets on
# KVM emulators (scripts/screenshots/capture-android.sh). Also captures the
# demo server's own web UI (PWA) with headless Chromium
# (scripts/screenshots/capture-pwa.py) and, best effort, the car app on an
# Android Automotive OS emulator (scripts/screenshots/capture-aaos.sh).
# Output: the `android-screenshots` artifact with phone/, tablet-7/, tablet-10/
# (1-sessions.png … 8-settings.png), pwa/ (1280x800) + pwa-mobile/ (390x844)
# (1-sessions.png … 6-settings.png) + pwa-slideshow.gif, and auto/
# (1-home.png … 6-about.png) + auto-slideshow.gif when an AAOS image with the
# Templates Host is available. Upload a folder to Play with
# play-listing-images.yml (run_id = this run, dir = phone | tablet-7 | tablet-10).

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: 'datawatch server version (e.g. 8.39.2); empty = newest release with a linux_amd64 binary'
        required: false
        default: ''

concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DW_URL: https://127.0.0.1:18443        # demo server, as seen from the runner
      DW_APP_URL: https://10.0.2.2:18443     # same server, as seen from the emulator
      DW_TOKEN: dw-test-token-12345          # documented public test token, demo server only
      GH_TOKEN: ${{ github.token }}
      APK_PATH: ${{ github.workspace }}/composeApp/build/outputs/apk/publicTrack/debug/composeApp-publicTrack-debug.apk
      EMULATOR_OPTS: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Observer tab shows the server host's name; use a neutral one.
      - name: Neutral host name
        run: |
          # Neutral demo home: project paths show as /home/demo/projects/… in the app.
          sudo mkdir -p /home/demo
          sudo chown "$(id -un)" /home/demo
          echo "DEMO_ROOT=/home/demo" >> "$GITHUB_ENV"
          echo "OUT_DIR=$RUNNER_TEMP/screenshots" >> "$GITHUB_ENV"
          sudo hostnamectl set-hostname demo
          echo "127.0.1.1 demo" | sudo tee -a /etc/hosts
          hostname

      - name: Install tmux (datawatch session backend)
        run: |
          command -v tmux || { sudo apt-get update -q && sudo apt-get install -y -q tmux; }
          tmux -V

      # Patch releases ship without binaries, so "latest" can have no assets:
      # take the newest release that has the linux_amd64 tarball.
      - name: Download datawatch server
        run: |
          set -euo pipefail
          ver="${{ inputs.server_version }}"
          if [ -z "$ver" ]; then
            for tag in $(gh release list -R dmz006/datawatch --limit 30 --json tagName -q '.[].tagName'); do
              if gh release view "$tag" -R dmz006/datawatch --json assets -q '.assets[].name' \
                  | grep -q '^datawatch_.*_linux_amd64\.tar\.gz$'; then
                ver="$tag"; break
              fi
            done
            [ -n "$ver" ] || { echo "::error::no recent datawatch release has a linux_amd64 binary"; exit 1; }
          fi
          ver="${ver#v}"
          echo "datawatch server v$ver"
          mkdir -p "$RUNNER_TEMP/dw-bin"
          gh release download "v$ver" -R dmz006/datawatch \
            -p "datawatch_${ver}_linux_amd64.tar.gz" -D "$RUNNER_TEMP/dw-bin"
          tar -xzf "$RUNNER_TEMP/dw-bin/datawatch_${ver}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/dw-bin" datawatch
          "$RUNNER_TEMP/dw-bin/datawatch" version

      - name: Start demo server
        run: |
          set -euo pipefail
          mkdir -p "$DEMO_ROOT/projects/weather-api"
          sed "s|__DEMO_ROOT__|$DEMO_ROOT|g" scripts/screenshots/demo-config.yaml > "$DEMO_ROOT/config.yaml"
          nohup python3 scripts/screenshots/ollama-stub.py > "$DEMO_ROOT/ollama-stub.log" 2>&1 &
          # Clean environment for the demo sessions; tmux panes start quiet-shell.sh
          # (no prompt/echo, so no runner user/host/paths in previews or alerts).
          (cd "$DEMO_ROOT" && nohup env -i HOME="$DEMO_ROOT" PATH="/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
              SHELL="$GITHUB_WORKSPACE/scripts/screenshots/quiet-shell.sh" TERM=xterm-256color LANG=C.UTF-8 USER=demo \
              "$RUNNER_TEMP/dw-bin/datawatch" --config "$DEMO_ROOT/config.yaml" start --foreground \
              > "$DEMO_ROOT/daemon.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sfk "$DW_URL/api/health"; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::demo server did not come up"; cat "$DEMO_ROOT/daemon.log"; exit 1

      - name: Seed demo content
        run: |
          set -euo pipefail
          # Keep going on a partial seed (screens still render); the log says what failed.
          bash scripts/screenshots/seed-demo.sh || echo "::warning::demo seed incomplete — see log above"
          echo "SESSION_ID=$(cat "$DEMO_ROOT/terminal-session-id")" >> "$GITHUB_ENV"
          echo "AUTOMATON_ID=$(cat "$DEMO_ROOT/automaton-id" 2>/dev/null || true)" >> "$GITHUB_ENV"
          echo "AUTO_SESSION_ID=$(cat "$DEMO_ROOT/prompt-session-id" 2>/dev/null || true)" >> "$GITHUB_ENV"
          # Watch the long-running sessions so they read as running, not idle.
          nohup python3 scripts/screenshots/keep-active.py $(cat "$DEMO_ROOT/keep-active-ids") \
            > "$DEMO_ROOT/keep-active.log" 2>&1 &

      # ── PWA: the demo server's own web UI in headless Chromium ──────────────
      # Pinned Playwright + Pillow in a throwaway venv. The token goes into
      # localStorage `cs_token` (where app.js reads it); self-signed TLS is
      # accepted for this browser context only. Non-fatal: phone/tablet/AAOS
      # still run if the web capture fails.
      - name: Install Playwright (Chromium) + Pillow
        id: pwa_setup
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/shots-venv"
          "$RUNNER_TEMP/shots-venv/bin/pip" install -q playwright==1.63.0 pillow==11.3.0
          "$RUNNER_TEMP/shots-venv/bin/python" -m playwright install --with-deps chromium
          echo "SHOTS_PY=$RUNNER_TEMP/shots-venv/bin/python" >> "$GITHUB_ENV"

      - name: Capture PWA (1280x800 desktop, 390x844 mobile)
        if: steps.pwa_setup.outcome == 'success'
        continue-on-error: true
        run: |
          "$SHOTS_PY" scripts/screenshots/capture-pwa.py --viewport both
          "$SHOTS_PY" scripts/screenshots/make-slideshow.py "$OUT_DIR/pwa-slideshow.gif" "$OUT_DIR"/pwa/*.png \
            --frame-ms 2500 --max-kb 400 --width 960

      # ── Build: debug APK (debug keystore; DEBUG launch hooks active) ────────
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-read-only: true

      - name: Assemble debug APK
        run: |
          ./gradlew :composeApp:assemblePublicTrackDebug --no-daemon --stacktrace
          ls -l "$APK_PATH"

      # ── Capture: one emulator per device size ───────────────────────────────
      # -skin sets the exact pixel size; capture-android.sh sets the density
      # (phone 411 dp wide; tablets ≥ 600 dp → two-pane) and validates sizes.
      - name: Capture phone (1080x2160)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: ${{ env.EMULATOR_OPTS }} -skin 1080x2160
          disable-animations: true
          script: bash scripts/screenshots/capture-android.sh phone

      - name: Capture 7-inch tablet (1200x1920)
        if: success() || failure()
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: ${{ env.EMULATOR_OPTS }} -skin 1200x1920
          disable-animations: true
          script: bash scripts/screenshots/capture-android.sh tablet-7

      - name: Capture 10-inch tablet (2560x1600)
        if: success() || failure()
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: ${{ env.EMULATOR_OPTS }} -skin 2560x1600
          disable-animations: true
          script: bash scripts/screenshots/capture-android.sh tablet-10

      # ── Android Automotive OS: the car app (:auto CarAppService) ───────────
      # The debug APK declares androidx.car.app.activity.CarAppActivity (debug
      # manifest only), so an AAOS emulator image that ships the Templates Host
      # renders the same Car App Library screens Android Auto shows. Only the
      # "…with Google Play" AAOS images carry that host. Best effort: never
      # fails the run, so PWA + phone/tablet artifacts still upload.
      - name: Probe Android Automotive system image
        id: aaos_probe
        if: success() || failure()
        continue-on-error: true
        run: |
          set -uo pipefail
          list=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null | grep -o 'system-images;[^ |]*automotive[^ |]*' | sort -u)
          echo "$list"
          for want in \
              'system-images;android-34-ext9;android-automotive-playstore;x86_64' \
              'system-images;android-35-ext15;android-automotive-playstore;x86_64' \
              'system-images;android-33;android-automotive-playstore;x86_64'; do
            if grep -qx "$want" <<< "$list"; then
              sys=$(cut -d';' -f2 <<< "$want"); sys=${sys#android-}
              {
                echo "found=true"
                echo "api=${sys%%-*}"
                echo "sysimg=$sys"
                echo "target=$(cut -d';' -f3 <<< "$want")"
              } >> "$GITHUB_OUTPUT"
              echo "using $want"; exit 0
            fi
          done
          echo "::warning::no AAOS Play Store x86_64 system image available to sdkmanager; skipping Android Automotive screenshots"
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Capture Android Automotive (1024x768)
        if: (success() || failure()) && steps.aaos_probe.outputs.found == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: ${{ steps.aaos_probe.outputs.api }}
          system-image-api-level: ${{ steps.aaos_probe.outputs.sysimg }}
          target: ${{ steps.aaos_probe.outputs.target }}
          arch: x86_64
          profile: automotive_1024p_landscape
          ram-size: 4096M
          emulator-options: ${{ env.EMULATOR_OPTS }}
          disable-animations: true
          script: bash scripts/screenshots/capture-aaos.sh

      - name: AAOS slideshow
        if: always() && env.SHOTS_PY != ''
        continue-on-error: true
        run: |
          if ls "$OUT_DIR"/auto/*.png >/dev/null 2>&1; then
            "$SHOTS_PY" scripts/screenshots/make-slideshow.py "$OUT_DIR/auto-slideshow.gif" "$OUT_DIR"/auto/*.png \
              --frame-ms 2500 --max-kb 400 --width 800
          else
            echo "no AAOS screenshots"
          fi

      - name: Server log tail
        if: always()
        run: |
          tail -60 "$DEMO_ROOT/daemon.log" || true
          tail -20 "$DEMO_ROOT/ollama-stub.log" || true
          tail -20 "$DEMO_ROOT/keep-active.log" || true
          curl -sk -H "Authorization: Bearer $DW_TOKEN" "$DW_URL/api/sessions" | head -c 3000 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: android-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14
