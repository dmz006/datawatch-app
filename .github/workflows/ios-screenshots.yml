name: iOS Screenshots

# App Store / TestFlight screenshots, generated on an Apple-silicon runner (the
# Intel-Mac simulator can't render emoji). Starts a throwaway datawatch demo
# server on the runner, seeds non-sensitive demo content
# (scripts/screenshots/seed-demo.sh), builds the Debug simulator app (DEBUG
# launch hooks: -dwSeedURL/-dwTab/-dwOpenSession…) and captures the iPhone 6.9"
# and iPad 13" sets. Output: the `ios-screenshots` artifact.

on:
  workflow_dispatch:
    inputs:
      server_version:
        description: 'datawatch server version (e.g. 8.39.2); empty = latest release'
        required: false
        default: ''

concurrency:
  group: ios-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Capture screenshots
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DW_URL: https://127.0.0.1:18443
      DW_TOKEN: dw-test-token-12345   # documented public test token, demo server only
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The Observer tab shows the server host's name; use a neutral one.
      - name: Neutral host name
        run: |
          # Neutral demo home: project paths show as /Users/demo/projects/… in the app.
          sudo mkdir -p /Users/demo
          sudo chown "$(id -un)" /Users/demo
          echo "DEMO_ROOT=/Users/demo" >> "$GITHUB_ENV"
          sudo scutil --set HostName demo
          sudo scutil --set LocalHostName demo
          sudo scutil --set ComputerName demo
          hostname

      - name: Install tmux (datawatch session backend)
        run: brew install tmux

      - name: Download datawatch server
        run: |
          set -euo pipefail
          ver="${{ inputs.server_version }}"
          if [ -z "$ver" ]; then
            # Newest release that ships a darwin_arm64 binary: patch releases
            # (e.g. v8.73.2) are published without binaries.
            for t in $(gh release list -R dmz006/datawatch --limit 30 --json tagName -q '.[].tagName'); do
              if gh release view "$t" -R dmz006/datawatch --json assets -q '.assets[].name' | grep -q "_darwin_arm64.tar.gz$"; then
                ver="$t"; break
              fi
            done
            [ -n "$ver" ] || { echo "::error::no datawatch release with a darwin_arm64 binary"; exit 1; }
          fi
          ver="${ver#v}"
          echo "datawatch server v$ver"
          mkdir -p "$RUNNER_TEMP/dw-bin"
          gh release download "v$ver" -R dmz006/datawatch \
            -p "datawatch_${ver}_darwin_arm64.tar.gz" -D "$RUNNER_TEMP/dw-bin"
          tar -xzf "$RUNNER_TEMP/dw-bin/datawatch_${ver}_darwin_arm64.tar.gz" -C "$RUNNER_TEMP/dw-bin" datawatch
          "$RUNNER_TEMP/dw-bin/datawatch" version

      - name: Start demo server
        run: |
          set -euo pipefail
          mkdir -p "$DEMO_ROOT/projects/weather-api"
          sed "s|__DEMO_ROOT__|$DEMO_ROOT|g" scripts/screenshots/demo-config.yaml > "$DEMO_ROOT/config.yaml"
          nohup python3 scripts/screenshots/ollama-stub.py > "$DEMO_ROOT/ollama-stub.log" 2>&1 &
          # Clean environment for the demo sessions; tmux panes start quiet-shell.sh
          # (no prompt/echo, so no runner user/host/paths in previews or alerts).
          (cd "$DEMO_ROOT" && nohup env -i HOME="$DEMO_ROOT" PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
              SHELL="$GITHUB_WORKSPACE/scripts/screenshots/quiet-shell.sh" TERM=xterm-256color LANG=en_US.UTF-8 USER=demo \
              BASH_SILENCE_DEPRECATION_WARNING=1 \
              "$RUNNER_TEMP/dw-bin/datawatch" --config "$DEMO_ROOT/config.yaml" start --foreground \
              > "$DEMO_ROOT/daemon.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sfk "$DW_URL/api/health"; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::demo server did not come up"; cat "$DEMO_ROOT/daemon.log"; exit 1

      - name: Seed demo content
        run: |
          set -euo pipefail
          # Keep going on a partial seed (screens still render); the log says what failed.
          bash scripts/screenshots/seed-demo.sh || echo "::warning::demo seed incomplete — see log above"
          echo "SESSION_ID=$(cat "$DEMO_ROOT/terminal-session-id")" >> "$GITHUB_ENV"
          echo "AUTOMATON_ID=$(cat "$DEMO_ROOT/automaton-id" 2>/dev/null || true)" >> "$GITHUB_ENV"
          # Watch the long-running sessions so they read as running, not idle.
          nohup python3 scripts/screenshots/keep-active.py $(cat "$DEMO_ROOT/keep-active-ids") \
            > "$DEMO_ROOT/keep-active.log" 2>&1 &

      # ── Build: same recipe as ios-build.yml (Debug, simulator) ─────────────
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: true

      - name: Cache Kotlin/Native artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Assemble KMP XCFramework (debug)
        run: ./gradlew :shared:assembleDatawatchSharedDebugXCFramework --no-daemon --stacktrace

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Export version env vars
        run: |
          set -euo pipefail
          v=$(sed -n 's/^DATAWATCH_APP_VERSION=//p' gradle.properties)
          c=$(sed -n 's/^DATAWATCH_APP_VERSION_CODE=//p' gradle.properties)
          [ -n "$v" ] && [ -n "$c" ] || { echo "::error::version not found in gradle.properties"; exit 1; }
          echo "DATAWATCH_APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "DATAWATCH_APP_VERSION_CODE=$c" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml

      # Unlike ios-build.yml this signs ad-hoc ("Sign to Run Locally"): an
      # unsigned app has no entitlements, so the simulator keychain rejects the
      # server token (and the seeded profile never saves).
      - name: Build for iOS Simulator (Debug)
        working-directory: iosApp
        run: |
          set -uo pipefail
          if xcodebuild build \
              -project DatawatchClient.xcodeproj \
              -scheme DatawatchClient \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
              ONLY_ACTIVE_ARCH=NO \
              > xcodebuild.log 2>&1; then
            echo "BUILD SUCCEEDED"
          else
            grep -E '(\.swift|\.m|\.h):[0-9]+:[0-9]+: error: ' xcodebuild.log | sort -u || true
            tail -40 xcodebuild.log
            exit 1
          fi
          app=$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || { echo "::error::no .app produced"; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Capture screenshots
        run: |
          set -euo pipefail
          xcrun simctl list runtimes
          OUT_DIR="$RUNNER_TEMP/screenshots" bash scripts/screenshots/capture.sh

      - name: Server log tail
        if: always()
        run: |
          tail -60 "$DEMO_ROOT/daemon.log" || true
          tail -20 "$DEMO_ROOT/ollama-stub.log" || true
          tail -20 "$DEMO_ROOT/keep-active.log" || true
          curl -sk -H "Authorization: Bearer $DW_TOKEN" "$DW_URL/api/sessions" | head -c 3000 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ios-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14
