name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and publish (e.g. v1.12.0). Leave blank to use current ref.'
        required: false
        type: string

permissions:
  contents: write

# Serialize Play Store uploads — concurrent edits cause "Edit deleted/expired" failures.
# cancel-in-progress: false so a queued older tag doesn't kill a newer one mid-flight.
concurrency:
  group: play-store-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Secret requirements (set in repo Settings → Secrets and variables → Actions):
#
#   KEYSTORE_BASE64       base64 of datawatch-upload-ring.jks
#                         `base64 -w0 ~/.android/datawatch-upload-ring.jks`
#   KEYSTORE_PASSWORD     keystore + key password (same value for both)
#   PLAY_PUBLISHER_KEY_JSON  raw JSON content of the Play service account key
#                         `cat ~/.android/datawatch-play-key.json`
#
# Variable (Settings → Secrets and variables → Actions → Variables):
#   PLAY_PUBLISHER_KEY_CONFIGURED   set to 'true' when PLAY_PUBLISHER_KEY_JSON is present

jobs:
  # Gate: a tag on a commit that fails the same checks as the CI workflow must
  # not reach the Play Store. Mirrors datawatch's release.yaml (test → publish).
  test:
    name: Test gate (version parity + check/detekt/ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Ensure gradle.properties and Version.kt agree
        run: |
          set -euo pipefail
          props_v=$(grep -oP '^DATAWATCH_APP_VERSION=\K.+' gradle.properties)
          props_c=$(grep -oP '^DATAWATCH_APP_VERSION_CODE=\K.+' gradle.properties)
          shared_v=$(grep -oP 'VERSION\s*:\s*String\s*=\s*"\K[^"]+' shared/src/commonMain/kotlin/com/dmzs/datawatchclient/Version.kt)
          shared_c=$(grep -oP 'VERSION_CODE\s*:\s*Int\s*=\s*\K[0-9]+' shared/src/commonMain/kotlin/com/dmzs/datawatchclient/Version.kt)
          echo "gradle.properties: version=$props_v code=$props_c"
          echo "Version.kt:        version=$shared_v code=$shared_c"
          if [ "$props_v" != "$shared_v" ] || [ "$props_c" != "$shared_c" ]; then
            echo "::error::Version mismatch — gradle.properties and Version.kt must agree. Bump both together."
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4
      - name: check + detekt + ktlint
        if: hashFiles('gradlew') != ''
        run: ./gradlew check detekt ktlintCheck --no-daemon --stacktrace

  build-bundles:
    name: Build AABs + create GitHub release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Write signing keystore
        if: hashFiles('gradlew') != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/datawatch-upload-ring.jks
          fi

      - name: Build release bundles
        if: hashFiles('gradlew') != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:bundlePublicTrackRelease \
            :composeApp:assemblePublicTrackRelease \
            :wear:bundleRelease \
            :wear:assembleRelease \
            --no-daemon --stacktrace

      - name: Compute checksums
        if: hashFiles('gradlew') != ''
        run: |
          find composeApp/build/outputs wear/build/outputs -type f \( -name '*.aab' -o -name '*.apk' -o -name 'mapping.txt' \) -print0 |
            xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        if: hashFiles('gradlew') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            composeApp/build/outputs/bundle/**/composeApp-*.aab
            composeApp/build/outputs/apk/**/composeApp-*.apk
            composeApp/build/outputs/mapping/**/mapping.txt
            wear/build/outputs/bundle/**/wear-*.aab
            wear/build/outputs/apk/**/wear-*.apk
            SHA256SUMS
          generate_release_notes: true

      - name: Placeholder release (pre-scaffold tags)
        if: hashFiles('gradlew') == ''
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Pre-MVP scaffold release. No binaries yet. See `docs/` for design package.

  publish-play:
    name: Publish to Play Store internal track
    runs-on: ubuntu-latest
    needs: build-bundles
    # Gate on a repo variable (not a secret — secrets aren't available in job-level
    # if conditions). Set PLAY_PUBLISHER_KEY_CONFIGURED=true in repo Settings →
    # Secrets and variables → Actions → Variables when the Play key is configured.
    if: ${{ vars.PLAY_PUBLISHER_KEY_CONFIGURED == 'true' && needs.build-bundles.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/datawatch-upload-ring.jks

      - name: Write Play service account key
        env:
          PLAY_PUBLISHER_KEY_JSON: ${{ secrets.PLAY_PUBLISHER_KEY_JSON }}
        run: |
          echo "$PLAY_PUBLISHER_KEY_JSON" > "$RUNNER_TEMP/play-key.json"

      - name: Generate Play Store release notes
        run: |
          set -euo pipefail
          VERSION=$(grep '^DATAWATCH_APP_VERSION=' gradle.properties | cut -d= -f2)
          NOTES_DIR="composeApp/src/publicTrack/play/release-notes/en-US"
          mkdir -p "$NOTES_DIR"
          {
            echo "v${VERSION}"
            echo ""
            # Last 5 non-merge commits, strip leading hash + type prefix, truncate to 80 chars each
            git log --oneline --no-merges -5 --pretty=format:"%s" \
              | sed 's/^fix: v[0-9.]* — //' \
              | sed 's/^feat: v[0-9.]* — //' \
              | sed 's/^fix: //' \
              | sed 's/^feat: //' \
              | cut -c1-80 \
              | sed 's/^/• /'
          } | head -c 500 > "$NOTES_DIR/internal.txt"
          echo "--- release notes ---"
          cat "$NOTES_DIR/internal.txt"

      - name: Publish to Play Store internal track
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PLAY_PUBLISHER_KEY: ${{ runner.temp }}/play-key.json
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:publishPublicTrackReleaseBundle \
            :wear:publishReleaseBundle \
            --no-daemon --stacktrace

      # Closed testing (Play track `alpha`) gets the same build: promoted from
      # internal, no re-upload. Google reviews each closed-track update before
      # testers see it. Phone → `alpha`; Wear → `wear:Wear closed testing`.
      - name: Promote to closed testing (alpha)
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_PUBLISHER_KEY_JSON }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth requests
          CODE=$(sed -n 's/^DATAWATCH_APP_VERSION_CODE=//p' gradle.properties)
          python3 scripts/play_promote.py --package com.dmzs.datawatchclient \
            --from-track internal --to-track alpha --version-code "$CODE"
          # Wear OS closed track (created 2026-10-07); Wear version codes are 100000 + phone code.
          python3 scripts/play_promote.py --package com.dmzs.datawatchclient \
            --from-track wear:internal --to-track "wear:Wear closed testing" --version-code "$((100000 + CODE))"

      - name: Clean up key file
        if: always()
        run: rm -f "$RUNNER_TEMP/play-key.json"

  # iOS: build, sign with fastlane match, upload to TestFlight. Gated on the
  # same test job as Play, and on the IOS_SIGNING_CONFIGURED repo variable so
  # tags keep working before Apple secrets exist. Secrets are listed in
  # .github/workflows/ios-match-init.yml and docs/plans/ios-testflight-setup.md.
  testflight:
    name: iOS — sign + upload to TestFlight
    runs-on: macos-26
    needs: test
    if: ${{ vars.IOS_SIGNING_CONFIGURED == 'true' && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native artifacts
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # App Store Connect rejects uploads built with an SDK older than iOS 26.
      - name: Require Xcode 26+ / iOS 26 SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iphoneos SDK: $sdk"
          [ "${sdk%%.*}" -ge 26 ] || { echo "::error::iOS SDK $sdk < 26 — App Store Connect will reject the upload."; exit 1; }

      - name: Assemble KMP XCFramework (release)
        run: ./gradlew :shared:assembleDatawatchSharedReleaseXCFramework --no-daemon --stacktrace

      # project.yml embeds the framework from the debug/ path (xcodegen has no
      # per-config dependency paths). Stage the release build there so the archive
      # links and embeds the release XCFramework.
      - name: Stage release XCFramework at the embedded path
        run: |
          set -euo pipefail
          rm -rf shared/build/XCFrameworks/debug
          mkdir -p shared/build/XCFrameworks/debug
          cp -R shared/build/XCFrameworks/release/DatawatchShared.xcframework shared/build/XCFrameworks/debug/

      - name: Install xcodegen + fastlane
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      # BSD grep on macOS has no -P; use sed.
      - name: Export version env vars
        run: |
          set -euo pipefail
          v=$(sed -n 's/^DATAWATCH_APP_VERSION=//p' gradle.properties)
          c=$(sed -n 's/^DATAWATCH_APP_VERSION_CODE=//p' gradle.properties)
          [ -n "$v" ] && [ -n "$c" ] || { echo "::error::version not found in gradle.properties"; exit 1; }
          echo "DATAWATCH_APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "DATAWATCH_APP_VERSION_CODE=$c" >> "$GITHUB_ENV"
          echo "iOS build: $v ($c)"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml

      # xcodegen regenerates Info.plist from project.yml `info.properties`; keys added
      # only to the file are silently dropped. Fail fast if any required key is missing.
      - name: Verify generated Info.plist keys
        working-directory: iosApp
        run: |
          set -euo pipefail
          missing=0
          for k in CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption \
                   NSMicrophoneUsageDescription NSFaceIDUsageDescription NSLocalNetworkUsageDescription \
                   UIBackgroundModes UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Print :$k" iosApp/Info.plist >/dev/null 2>&1 || { echo "::error::Info.plist missing $k — add it to project.yml info.properties"; missing=1; }
          done
          # Widget extension (BL403): its version must match the app's, and it must
          # declare the WidgetKit extension point.
          for k in CFBundleShortVersionString CFBundleVersion NSExtension:NSExtensionPointIdentifier; do
            /usr/libexec/PlistBuddy -c "Print :$k" DatawatchWidgets/Info.plist >/dev/null 2>&1 || { echo "::error::DatawatchWidgets/Info.plist missing $k — add it to project.yml (DatawatchWidgets info.properties)"; missing=1; }
          done
          [ "$missing" -eq 0 ] && echo "Info.plist: all required keys present"
          exit $missing

      # Same credential handling as ios-match-init.yml: prefer raw MATCH_GIT_PAT,
      # fall back to a pre-encoded MATCH_GIT_BASIC_AUTHORIZATION (whitespace-stripped).
      - name: Resolve certs repo credentials
        env:
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
          MATCH_GIT_BASIC_AUTHORIZATION_IN: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          set -uo pipefail
          if [ -n "${MATCH_GIT_PAT:-}" ]; then
            auth=$(printf 'x-access-token:%s' "$MATCH_GIT_PAT" | base64 | tr -d '\n')
          else
            auth=$(printf '%s' "${MATCH_GIT_BASIC_AUTHORIZATION_IN:-}" | tr -d '[:space:]')
          fi
          echo "::add-mask::$auth"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$auth" >> "$GITHUB_ENV"

      - name: Sign, build and upload (fastlane beta)
        working-directory: iosApp
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_TERMINAL_PROMPT: "0"
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          fastlane beta

      - name: Attach IPA to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: iosApp/build/DatawatchClient.ipa

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain build.keychain || true

  # Release parity (AGENT.md § Release parity): once Apple has processed the
  # build, add it to the external group and submit it for Beta App Review, then
  # fail the release if any channel (Play phone/Wear internal + closed, TestFlight)
  # is behind this version.
  testflight-beta:
    name: iOS — submit build for Beta App Review
    runs-on: macos-26
    needs: testflight
    if: ${{ needs.testflight.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Export version env vars
        run: |
          set -euo pipefail
          echo "DATAWATCH_APP_VERSION=$(sed -n 's/^DATAWATCH_APP_VERSION=//p' gradle.properties)" >> "$GITHUB_ENV"
          echo "DATAWATCH_APP_VERSION_CODE=$(sed -n 's/^DATAWATCH_APP_VERSION_CODE=//p' gradle.properties)" >> "$GITHUB_ENV"
      - name: Wait for App Store Connect processing
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" requests 2>/dev/null \
            || python3 -m pip install --quiet "pyjwt[crypto]" requests
          python3 scripts/release_parity.py wait-ios --code "$DATAWATCH_APP_VERSION_CODE" --timeout-min 90
      - name: Install fastlane
        run: gem install fastlane --no-document
      - name: Submit for Beta App Review (fastlane testflight_setup)
        working-directory: iosApp
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          BETA_FEEDBACK_EMAIL: ${{ secrets.BETA_FEEDBACK_EMAIL }}
          BETA_REVIEW_CONTACT_FIRST_NAME: ${{ secrets.BETA_REVIEW_CONTACT_FIRST_NAME }}
          BETA_REVIEW_CONTACT_LAST_NAME: ${{ secrets.BETA_REVIEW_CONTACT_LAST_NAME }}
          BETA_REVIEW_CONTACT_PHONE: ${{ secrets.BETA_REVIEW_CONTACT_PHONE }}
          BETA_REVIEW_CONTACT_EMAIL: ${{ secrets.BETA_REVIEW_CONTACT_EMAIL }}
          BETA_REVIEW_DEMO_URL: ${{ secrets.BETA_REVIEW_DEMO_URL }}
          BETA_REVIEW_DEMO_TOKEN: ${{ secrets.BETA_REVIEW_DEMO_TOKEN }}
          SUBMIT_FOR_BETA_REVIEW: "true"
          EXTERNAL_GROUP: Beta testers
        run: fastlane testflight_setup

  release-parity:
    name: Verify release parity (Play phone + Wear, TestFlight)
    runs-on: ubuntu-latest
    needs: [publish-play, testflight-beta]
    if: ${{ always() && needs.publish-play.result != 'skipped' && needs.testflight-beta.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
      - name: Every channel carries this build
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_PUBLISHER_KEY_JSON }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          pip install --quiet "pyjwt[crypto]" requests google-auth
          python3 scripts/release_parity.py verify --code "$(sed -n 's/^DATAWATCH_APP_VERSION_CODE=//p' gradle.properties)"
