# CodeQL — advanced setup for all three languages (Swift, Kotlin/Java, GitHub
# Actions). Replaces GitHub's default setup (operator, 2026-10-05), which can't
# build the Swift app and rejects advanced-setup uploads while it is enabled.
#
# Swift job:
# Default-setup's Swift autobuild cannot build this project: the Xcode project
# is generated at build time by xcodegen and links the KMP shared module's
# XCFramework, which Gradle must assemble first. This workflow reuses
# ios-build.yml's build-simulator recipe (JDK → Gradle XCFramework → xcodegen →
# xcodebuild for the simulator) wrapped by CodeQL init/analyze in manual build
# mode (Swift supports `autobuild` and `manual`; `none` is not available).
#
# Kotlin job: manual build mode traces the Android + Wear Kotlin compilation.
# Actions job: build-mode none (workflow files only).

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'composeApp/**'
      - 'wear/**'
      - '**/*.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - 'composeApp/**'
      - 'wear/**'
      - '**/*.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/**'
  schedule:
    - cron: '0 14 * * 1'   # weekly, Monday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-26   # same image as ios-build.yml (Xcode version parity)
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write   # upload SARIF results
      actions: read            # CodeQL reads workflow run metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Build the Kotlin side BEFORE codeql init so CodeQL only traces the
      # Swift compilation (the XCFramework is a prebuilt binary dependency).
      - name: Assemble KMP XCFramework (debug)
        run: ./gradlew :shared:assembleDatawatchSharedDebugXCFramework --no-daemon --stacktrace

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Export version env vars
        run: |
          set -euo pipefail
          v=$(sed -n 's/^DATAWATCH_APP_VERSION=//p' gradle.properties)
          c=$(sed -n 's/^DATAWATCH_APP_VERSION_CODE=//p' gradle.properties)
          [ -n "$v" ] && [ -n "$c" ] || { echo "::error::version not found in gradle.properties"; exit 1; }
          echo "DATAWATCH_APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "DATAWATCH_APP_VERSION_CODE=$c" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: swift
          build-mode: manual

      # Clean build (no DerivedData cache) so every Swift file is compiled and
      # therefore extracted. No signing for simulator builds.
      - name: Build for iOS Simulator (traced by CodeQL)
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project DatawatchClient.xcodeproj \
            -scheme DatawatchClient \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: '/language:swift'

  analyze-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c  # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual

      # No build cache / daemon so every Kotlin file is compiled (and extracted).
      - name: Compile Kotlin (traced by CodeQL)
        run: |
          ./gradlew --no-daemon --no-build-cache --rerun-tasks \
            :shared:compileDebugKotlinAndroid \
            :composeApp:compilePublicTrackDebugKotlinAndroid \
            :wear:compileDebugKotlin

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: '/language:java-kotlin'

  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: actions
          build-mode: none
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: '/language:actions'
