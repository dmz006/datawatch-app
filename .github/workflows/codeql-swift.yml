# CodeQL for the Swift iOS app (advanced setup).
#
# Default-setup's Swift autobuild cannot build this project: the Xcode project
# is generated at build time by xcodegen and links the KMP shared module's
# XCFramework, which Gradle must assemble first. This workflow reuses
# ios-build.yml's build-simulator recipe (JDK → Gradle XCFramework → xcodegen →
# xcodebuild for the simulator) wrapped by CodeQL init/analyze in manual build
# mode (Swift supports `autobuild` and `manual`; `none` is not available).
#
# NOTE: GitHub rejects advanced-setup CodeQL uploads while default setup is
# enabled for the repo. Default setup currently covers `actions` + `java-kotlin`
# only (Swift was dropped), but the switch to advanced setup has to be made in
# Settings → Code security before this workflow's results are accepted.

name: codeql-swift

on:
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/src/iosMain/**'
      - 'shared/src/commonMain/**'
      - 'shared/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/codeql-swift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/src/iosMain/**'
      - 'shared/src/commonMain/**'
      - 'shared/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/codeql-swift.yml'
  schedule:
    - cron: '0 14 * * 1'   # weekly, Monday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-26   # same image as ios-build.yml (Xcode version parity)
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write   # upload SARIF results
      actions: read            # CodeQL reads workflow run metadata
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Cache Kotlin/Native artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Build the Kotlin side BEFORE codeql init so CodeQL only traces the
      # Swift compilation (the XCFramework is a prebuilt binary dependency).
      - name: Assemble KMP XCFramework (debug)
        run: ./gradlew :shared:assembleDatawatchSharedDebugXCFramework --no-daemon --stacktrace

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Export version env vars
        run: |
          set -euo pipefail
          v=$(sed -n 's/^DATAWATCH_APP_VERSION=//p' gradle.properties)
          c=$(sed -n 's/^DATAWATCH_APP_VERSION_CODE=//p' gradle.properties)
          [ -n "$v" ] && [ -n "$c" ] || { echo "::error::version not found in gradle.properties"; exit 1; }
          echo "DATAWATCH_APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "DATAWATCH_APP_VERSION_CODE=$c" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: swift
          build-mode: manual

      # Clean build (no DerivedData cache) so every Swift file is compiled and
      # therefore extracted. No signing for simulator builds.
      - name: Build for iOS Simulator (traced by CodeQL)
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project DatawatchClient.xcodeproj \
            -scheme DatawatchClient \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: '/language:swift'
