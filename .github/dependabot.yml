# Version-update PRs for stable releases (Dependabot does not propose
# pre-releases while the current version is stable). Security fixes that
# are only available as pre-releases are tracked in
# security/accepted-risks.yml and re-checked daily by sca-fix-watch.yml.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    # Each open Dependabot PR runs the iOS build + CodeQL on macOS runners,
    # and Dependabot used to rebase every PR on each push to main — on busy
    # days that starved the release workflow's TestFlight job (2026-10-06).
    # So: no automatic rebases (comment "@dependabot rebase" when needed) and
    # all minor/patch updates in one grouped PR; majors stay separate PRs
    # because they need individual review.
    rebase-strategy: disabled
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
