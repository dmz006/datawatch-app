name: DatawatchClient
options:
  bundleIdPrefix: com.dmzs
  developmentLanguage: en
  deploymentTarget:
    iOS: 16.0

targets:
  DatawatchClient:
    type: application
    platform: iOS
    sources:
      - iosApp
      # xterm.js host page + vendored libs, shared byte-for-byte with Android.
      # Folder reference so the bundle keeps the xterm/ subdirectory;
      # TerminalView loads host.html from it (no CDN, works offline).
      - path: ../composeApp/src/androidMain/assets/xterm
        type: folder
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: datawatch
        CFBundleDevelopmentRegion: en
        # Parity B39: same locales as PWA + Android (Resources/<lang>.lproj).
        CFBundleLocalizations:
          - en
          - de
          - es
          - fr
          - ja
        UILaunchScreen:
          UIColorName: ""
        # Everything the built Info.plist needs MUST live here — xcodegen regenerates
        # iosApp/Info.plist from these properties and drops keys added to the file directly.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        # D84b deep links: datawatch://session/<id>, datawatch://<tab> (AppRouter).
        CFBundleURLTypes:
          - CFBundleURLName: com.dmzs.datawatchclient
            CFBundleURLSchemes:
              - datawatch
        NSCameraUsageDescription: "datawatch uses the camera when you take a photo to attach to a session reply."
        NSFaceIDUsageDescription: "datawatch uses Face ID to protect access to your server profiles."
        NSLocalNetworkUsageDescription: "datawatch connects to server addresses you configure, which may be on your local network."
        NSMicrophoneUsageDescription: "datawatch uses the microphone to record voice commands for transcription via your configured Whisper backend."
        UIBackgroundModes: 
          - remote-notification
        UISupportedInterfaceOrientations: 
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad": 
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iosApp/DatawatchClient.entitlements
      # xcodegen regenerates this file from `properties` (it dropped the hand-written
      # keys before). Keychain group = the app's own (IosTokenStore).
      # aps-environment: Push Notifications is enabled on the App ID and the match
      # App Store profile carries aps-environment = production (verified
      # 2026-10-06, ios-match-init.yml printout). TestFlight / App Store use
      # production (Apple: aps-environment docs). Debug simulator builds are
      # ad-hoc/unsigned, so this value only matters for the signed release.
      properties:
        aps-environment: production
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.dmzs.datawatchclient
    settings:
      base:
        # Bundle ID must match Android phone app so the same Apple Developer
        # account can publish both as a universal cross-platform brand.
        PRODUCT_BUNDLE_IDENTIFIER: com.dmzs.datawatchclient
        # Version values injected from gradle.properties by CI and build-ios-framework.sh.
        # See docs/setup.md §iOS and .github/workflows/ios-build.yml for how these are set.
        MARKETING_VERSION: ${DATAWATCH_APP_VERSION}
        CURRENT_PROJECT_VERSION: ${DATAWATCH_APP_VERSION_CODE}
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/XCFrameworks/debug
        # SQLDelight native driver (SQLiter) calls the system SQLite.
        OTHER_LDFLAGS: $(inherited) -framework DatawatchShared -lsqlite3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/XCFrameworks/release
    dependencies:
      - framework: ../shared/build/XCFrameworks/debug/DatawatchShared.xcframework
        embed: true
      - sdk: LocalAuthentication.framework
      - sdk: UserNotifications.framework
      - sdk: WebKit.framework
