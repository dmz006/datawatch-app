name: Font update (JetBrains Mono)

# Keeps the bundled terminal font (D8a) current: monthly check of the upstream
# JetBrains Mono release; opens a PR when a newer version is published.
on:
  schedule:
    - cron: "17 6 1 * *"   # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check / update font
        id: upd
        run: |
          out="$(./scripts/update-jetbrains-mono.sh)"
          echo "$out"
          echo "result=$out" >> "$GITHUB_OUTPUT"
      - name: Open PR
        if: startsWith(steps.upd.outputs.result, 'UPDATED')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="$(cat composeApp/src/androidMain/assets/xterm/fonts/JetBrainsMono.VERSION)"
          branch="chore/jetbrains-mono-$ver"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add composeApp/src/androidMain/assets/xterm/fonts
          git commit -m "chore(fonts): JetBrains Mono $ver (terminal font, D8a)"
          git push -u origin "$branch"
          body="Automated monthly check found a newer upstream JetBrains Mono release (${{ steps.upd.outputs.result }}). Terminal font for Android + iOS (shared xterm assets). Licence: SIL OFL 1.1 (fonts/JetBrainsMono-OFL.txt)."
          # Repo may not allow Actions to open PRs; fall back to an issue linking the branch.
          gh pr create --title "chore(fonts): JetBrains Mono $ver" --body "$body" \
            || gh issue create --title "chore(fonts): JetBrains Mono $ver available" \
                 --body "$body Branch \`$branch\` is ready: https://github.com/${{ github.repository }}/compare/$branch?expand=1"
