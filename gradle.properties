# JVM
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# Compose
org.jetbrains.compose.experimental.uikit.enabled=true

# Versioning — read by CI version-parity check
DATAWATCH_APP_VERSION=1.27.1
DATAWATCH_APP_VERSION_CODE=655

# Android Lint: AGP 8.5.2 bundles a Kotlin 2.0 analyzer that cannot read Kotlin 2.4
# metadata (lint would log "incompatible version of Kotlin" and silently degrade).
# Run the lint shipped with AGP 9.3.1 (newest AGP the Kotlin 2.4.20 table lists)
# while still building with AGP 8.5.2. Lint-only; does not affect build outputs.
android.experimental.lint.version=9.3.1
