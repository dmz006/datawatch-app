name: iOS Build

on:
  push:
    branches: [ main ]
    paths:
      - 'iosApp/**'
      - 'shared/src/iosMain/**'
      - 'shared/src/commonMain/**'
      - 'shared/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ios-build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'iosApp/**'
      - 'shared/src/iosMain/**'
      - 'shared/src/commonMain/**'
      - 'shared/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ios-build.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Simulator compile check on every push/PR. Signing + TestFlight upload lives in
# release.yml (`testflight` job, tag-triggered, behind the test gate); the
# one-shot certificate setup is .github/workflows/ios-match-init.yml.
# Least-privilege GITHUB_TOKEN: these jobs only read the repo.
permissions:
  contents: read

jobs:
  build-simulator:
    name: Build (iOS Simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Cache Kotlin/Native compiler and prebuilt stdlib (~1 GB).
      # Key on Kotlin version (from libs.versions.toml) to bust when upgrading.
      - name: Cache Kotlin/Native artifacts
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Builds all three iOS slices (iosX64, iosArm64, iosSimulatorArm64) and
      # packages them into shared/build/XCFrameworks/debug/DatawatchShared.xcframework.
      # project.yml FRAMEWORK_SEARCH_PATHS points to this directory.
      - name: Assemble KMP XCFramework (debug)
        run: ./gradlew :shared:assembleDatawatchSharedDebugXCFramework --no-daemon --stacktrace

      - name: Install xcodegen
        run: brew install xcodegen

      # Export version env vars so project.yml can substitute them into
      # MARKETING_VERSION and CURRENT_PROJECT_VERSION build settings.
      # BSD grep on macOS has no -P; use sed.
      - name: Export version env vars
        run: |
          set -euo pipefail
          v=$(sed -n 's/^DATAWATCH_APP_VERSION=//p' gradle.properties)
          c=$(sed -n 's/^DATAWATCH_APP_VERSION_CODE=//p' gradle.properties)
          [ -n "$v" ] && [ -n "$c" ] || { echo "::error::version not found in gradle.properties"; exit 1; }
          echo "DATAWATCH_APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "DATAWATCH_APP_VERSION_CODE=$c" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate --spec project.yml

      # xcodegen regenerates Info.plist from project.yml `info.properties`; keys added
      # only to the file are silently dropped. Fail fast if any required key is missing.
      - name: Verify generated Info.plist keys
        working-directory: iosApp
        run: |
          set -euo pipefail
          missing=0
          for k in CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption \
                   NSMicrophoneUsageDescription NSFaceIDUsageDescription NSLocalNetworkUsageDescription \
                   UIBackgroundModes UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
            /usr/libexec/PlistBuddy -c "Print :$k" iosApp/Info.plist >/dev/null 2>&1 || { echo "::error::Info.plist missing $k — add it to project.yml info.properties"; missing=1; }
          done
          [ "$missing" -eq 0 ] && echo "Info.plist: all required keys present"
          exit $missing

      # Simulator builds need no signing. ONLY_ACTIVE_ARCH=NO ensures all
      # simulator slices build (catches arm64/x64 portability issues).
      # Must fail the job when xcodebuild fails. (A previous `| grep … || cat log`
      # tail swallowed the exit code, so Swift compile errors reported green.)
      - name: Build for iOS Simulator
        working-directory: iosApp
        run: |
          set -uo pipefail
          if xcodebuild build \
              -project DatawatchClient.xcodeproj \
              -scheme DatawatchClient \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              > xcodebuild.log 2>&1; then
            echo "BUILD SUCCEEDED — $(grep -c ' warning: ' xcodebuild.log || true) warnings"
          else
            echo "::group::Compiler errors"
            grep -E '(\.swift|\.m|\.h):[0-9]+:[0-9]+: error: ' xcodebuild.log | sort -u || true
            echo "::endgroup::"
            grep -E '(\.swift):[0-9]+:[0-9]+: error: ' xcodebuild.log | sort -u | \
              sed -E 's#^.*/(iosApp/[^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=iosApp/\1,line=\2,col=\3::\4#' || true
            tail -40 xcodebuild.log
            exit 1
          fi

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: iosApp/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      # Cache derived data between runs to speed up incremental Xcode builds.
      - name: Cache Xcode derived data
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: xcode-deriveddata-${{ runner.os }}-${{ hashFiles('iosApp/project.yml', 'shared/src/**') }}
          restore-keys: xcode-deriveddata-${{ runner.os }}-
