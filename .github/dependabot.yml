# Version-update PRs for stable releases (Dependabot does not propose
# pre-releases while the current version is stable). Security fixes that
# are only available as pre-releases are tracked in
# security/accepted-risks.yml and re-checked daily by sca-fix-watch.yml.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    # Each open Dependabot PR runs the iOS build + CodeQL on macOS runners,
    # and Dependabot used to rebase every PR on each push to main — on busy
    # days that starved the release workflow's TestFlight job (2026-10-06).
    # So: no automatic rebases (comment "@dependabot rebase" when needed) and
    # all minor/patch updates in one grouped PR; majors stay separate PRs
    # because they need individual review.
    rebase-strategy: disabled
    # Majors blocked by the toolchain migration (BL418,
    # docs/plans/2026-10-09-bl418-android-toolchain-migration.md). Remove an entry
    # when that step of BL418 is scheduled.
    ignore:
      - dependency-name: "com.android.*"          # AGP 9 (#222)
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.github.triplet.play*" # Gradle Play Publisher 4 needs AGP 9 (#232)
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.ktor*"               # ktor 3 + okhttp 5 need compileSdk 37 (#228)
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    rebase-strategy: disabled
    # gradle/actions v6 moved its caching into a proprietary component under Gradle's
    # separate terms of use (not MIT). Stay on v5 (MIT, Node 24) until the operator
    # decides. See docs/plans/README.md BL419.
    ignore:
      - dependency-name: "gradle/actions*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
