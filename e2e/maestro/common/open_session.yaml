# Open the sandbox's e2e-shell session from the Sessions tab (no-op if already open).
appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible: "Aa▾"
    commands:
      - runFlow: home.yaml
      - tapOn: "Sessions"
      - extendedWaitUntil:
          visible: "e2e-shell"
          timeout: 30000
      - tapOn: "e2e-shell"
- extendedWaitUntil:
    visible: "Aa▾"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Connecting to session…"
    timeout: 30000
