name: Play — set closed-test tester group

# Attach a Google Group to a Play testing track through the API.
# NOTE: Google refuses this for tracks upgraded to the current closed/open
# testing (403 "switch back to communities-based testing") — that includes
# `alpha` here. Add groups for those in Play Console › Closed testing ›
# Testers instead. Kept for legacy tracks.

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Google Group email'
        type: string
        default: 'datawatch-testers@googlegroups.com'
      track:
        description: 'Track'
        type: string
        default: 'alpha'

permissions:
  contents: read

jobs:
  testers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set tester group
        env:
          PLAY_KEY_JSON: ${{ secrets.PLAY_PUBLISHER_KEY_JSON }}
        run: |
          set -euo pipefail
          pip install --quiet google-auth requests
          python3 scripts/play_testers.py --package com.dmzs.datawatchclient \
            --track "${{ inputs.track }}" --group "${{ inputs.group }}"
